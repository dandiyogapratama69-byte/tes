name: Build Flipbook Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          echo "=== CARI FILE WASM ==="
          find target -name "*.wasm" -exec ls -lh {} \;
          WASM_FILE=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          echo "Ketemu: $WASM_FILE"
          cp "$WASM_FILE" ./flipbook_plugin.wasm
          ls -lh flipbook_plugin.wasm flipbook-plugin.json
          zip -j flipbook-timeline.procraft-plugin flipbook-plugin.json flipbook_plugin.wasm
          echo "=== ISI PLUGIN ==="
          unzip -l flipbook-timeline.procraft-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: flipbook-plugin
          path: flipbook-timeline.procraft-plugin
