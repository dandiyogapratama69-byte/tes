name: Build Flipbook Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          cp target/wasm32-unknown-unknown/release/flipbook_plugin.wasm ./flipbook_plugin.wasm
          zip -j flipbook-timeline.procraft-plugin flipbook-plugin.json flipbook_plugin.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: flipbook-plugin
          path: flipbook-timeline.procraft-plugin
