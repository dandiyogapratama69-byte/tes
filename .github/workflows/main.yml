name: Build Flipbook Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          WASM_FILE=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          cp "$WASM_FILE" ./flipbook_plugin.wasm
          ls -lh flipbook_plugin.wasm plugin.json main.js
          # Bikin 3 nama manifest biar ProCraft pasti nemu salah satu
          cp plugin.json manifest.json
          cp plugin.json flipbook-plugin.json
          zip -j flipbook-timeline.procraft-plugin plugin.json manifest.json flipbook-plugin.json main.js flipbook_plugin.wasm
          echo "=== ISI PLUGIN FINAL ==="
          unzip -l flipbook-timeline.procraft-plugin
          ls -lh flipbook-timeline.procraft-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: flipbook-plugin
          path: flipbook-timeline.procraft-plugin
