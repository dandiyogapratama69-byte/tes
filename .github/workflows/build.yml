name: Build Flipbook Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: |
          # Ambil file yang PASTI, jangan pakai find
          cp target/wasm32-unknown-unknown/release/flipbook_plugin.wasm ./flipbook_plugin.wasm
          ls -lh flipbook_plugin.wasm procraft-plugin.json
          cat procraft-plugin.json
          echo "=== ISI PLUGIN FINAL ==="
          zip -0 -j flipbook-timeline.procraft-plugin procraft-plugin.json flipbook_plugin.wasm
          unzip -l flipbook-timeline.procraft-plugin
          ls -lh flipbook-timeline.procraft-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: flipbook-plugin
          path: flipbook-timeline.procraft-plugin